[package]
name = "bohime"
version = "0.1.0"
edition = "2024"
license = "MIT"
publish = false

[dependencies]
clap = { version = "4", features = ["derive"] }
crc32fast = "1"
prost = "0.13"
rand = "0.8"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["net"] }
tonic = "0.13"

[build-dependencies]
tonic-build = "0.13"

[dev-dependencies]
tempfile = "3"
