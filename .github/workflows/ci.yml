name: CI

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    # Nightly, for the 100k-seed sweep — see the `sweep` job.
    - cron: '0 3 * * *'
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: test
        run: cargo nextest run --workspace

      # M4's reproducibility dies silently if either pure crate gains an async
      # runtime, and nothing else in CI would notice.
      - name: kv-raft and kv-sim stay free of tokio
        run: |
          for crate in kv-raft kv-sim; do
            if cargo tree -p "$crate" -e normal | grep -q tokio; then
              echo "::error::$crate depends on tokio; the deterministic simulator requires it not to"
              exit 1
            fi
          done

      # The 10k-seed election gate is ~2s, so it runs on every push. The
      # 100k-seed nemesis gate takes ~80 minutes and runs nightly instead —
      # see the `sweep` job.
      - name: election gate (10k seeds)
        run: cargo nextest run -p kv-sim --run-ignored all -E 'test(election_sweep_full)'

  # M4's full nemesis gate: 100k seeds, ~80 minutes. Far too slow to gate a
  # push, but it is the milestone's headline claim and has caught real bugs,
  # so it runs nightly and on demand rather than not at all.
  sweep:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: nemesis gate (100k seeds)
        run: cargo nextest run --release -p kv-sim --run-ignored all -E 'test(nemesis_sweep_full)'
