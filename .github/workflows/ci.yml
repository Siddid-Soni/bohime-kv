name: CI

on:
  push:
    branches: [master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - uses: Swatinem/rust-cache@v2

      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest

      - name: fmt
        run: cargo fmt --all -- --check

      - name: clippy
        run: cargo clippy --workspace --all-targets --all-features -- -D warnings

      - name: test
        run: cargo nextest run --workspace

      # M4's reproducibility dies silently if either pure crate gains an async
      # runtime, and nothing else in CI would notice.
      - name: kv-raft and kv-sim stay free of tokio
        run: |
          for crate in kv-raft kv-sim; do
            if cargo tree -p "$crate" -e normal | grep -q tokio; then
              echo "::error::$crate depends on tokio; the deterministic simulator requires it not to"
              exit 1
            fi
          done

      - name: seed sweeps (full gates)
        run: cargo nextest run -p kv-sim --run-ignored all -E 'test(sweep_full)'
