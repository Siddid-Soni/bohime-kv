syntax = "proto3";
package bohime.kv;

// Client-facing API. Filled in starting at M6.

service KvService {
  rpc Get(GetRequest) returns (GetResponse);
  rpc Put(PutRequest) returns (PutResponse);
  rpc Delete(DeleteRequest) returns (DeleteResponse);
  rpc Cas(CasRequest) returns (CasResponse);
}

message ClientContext {
  uint64 client_id = 1;
  uint64 sequence_number = 2;
}

message NotLeader {
  uint64 leader_hint = 1;
}

// This node does not replicate the key's shard (M11).
//
// An ordinary answer, like NotLeader, rather than an error: it is what a
// client whose cached shard map is a version behind gets, and a client handed
// an error would drop the connection instead of re-routing. The replica list
// is what turns the retry into one redirect instead of a scan.
message NotHosted {
  uint32 shard = 1;
  // The shard's replica set in ring order, as this node's map has it.
  repeated uint64 replicas = 2;
  // Which version of the map said so, so a client can tell "my map is stale"
  // from "this node's map is stale".
  uint64 map_version = 3;
}

message GetRequest {
  bytes key = 1;
}

message GetResponse {
  optional bytes value = 1;
  optional NotLeader not_leader = 2;
  optional NotHosted not_hosted = 3;
}

message PutRequest {
  ClientContext ctx = 1;
  bytes key = 2;
  bytes value = 3;
}

message PutResponse {
  optional NotLeader not_leader = 1;
  optional NotHosted not_hosted = 2;
}

message DeleteRequest {
  ClientContext ctx = 1;
  bytes key = 2;
}

message DeleteResponse {
  optional NotLeader not_leader = 1;
  optional NotHosted not_hosted = 2;
}

message CasRequest {
  ClientContext ctx = 1;
  bytes key = 2;
  optional bytes expected = 3;
  bytes new_value = 4;
}

message CasResponse {
  bool swapped = 1;
  optional NotLeader not_leader = 2;
  optional NotHosted not_hosted = 3;
}
