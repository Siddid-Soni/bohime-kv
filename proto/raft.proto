syntax = "proto3";
package bohime.raft;

// Node-to-node consensus RPCs. See docs/superpowers/specs (or the design
// plan) for the semantics of each field — this file is intentionally a
// skeleton to be filled in starting at M5.

service RaftService {
  rpc RequestVote(RequestVoteRequest) returns (RequestVoteResponse);
  rpc AppendEntries(AppendEntriesRequest) returns (AppendEntriesResponse);
  rpc InstallSnapshot(stream InstallSnapshotChunk) returns (InstallSnapshotResponse);
  rpc TimeoutNow(TimeoutNowRequest) returns (TimeoutNowResponse);
  // Every group's traffic to one peer, in one round trip (M11.3).
  //
  // The four RPCs above are one message per round trip, which caps a link at
  // roughly one message per RTT. A node hosting a Raft group per shard has to
  // heartbeat every one of them inside a single election timeout, so the
  // per-peer sender coalesces whatever is queued into one of these instead.
  // The unary RPCs stay: they are the same handlers with an arity of one, and
  // InstallSnapshot cannot be batched at all since it is a stream.
  rpc Batch(BatchRequest) returns (BatchResponse);
}

// One Raft message addressed to one group.
//
// The group is here rather than only inside the request because a *response*
// carries none of its own — and a batch response has to say which group each
// reply belongs to, or the caller cannot step it into the right log.
message RaftEnvelope {
  uint32 group = 1;
  oneof msg {
    RequestVoteRequest vote = 2;
    RequestVoteResponse vote_resp = 3;
    AppendEntriesRequest append = 4;
    AppendEntriesResponse append_resp = 5;
    TimeoutNowRequest timeout_now = 6;
    TimeoutNowResponse timeout_now_resp = 7;
  }
}

message BatchRequest {
  repeated RaftEnvelope msgs = 1;
}

// One reply per envelope that could be delivered — fewer than the request
// carried when a group has moved away or its inbox is full. Deliberately not
// all-or-nothing: a batch that failed whole would make one absent shard cost
// every other group in the same RPC its round trip.
message BatchResponse {
  repeated RaftEnvelope msgs = 1;
}

message RequestVoteRequest {
  // Which Raft group on the target process this message is for (M10).
  //
  // A node hosts more than one group from M10 on — the meta group holding the
  // shard map beside the data group(s) — and they share a process, a port and
  // a peer address. Only this distinguishes them, and misrouting is not a
  // dropped message but a message applied to the wrong log.
  //
  // 0 is reserved and always rejected: proto3 gives an absent field its zero
  // value, so without a reserved value a sender that forgot to set the group
  // would be indistinguishable from one that meant group 0, and the message
  // would be delivered somewhere plausible instead of refused. Same reasoning
  // as the `optional` conflict hints above.
  uint32 group = 5;
  uint64 term = 1;
  uint64 candidate_id = 2;
  uint64 last_log_index = 3;
  uint64 last_log_term = 4;
}

message RequestVoteResponse {
  uint64 term = 1;
  bool vote_granted = 2;
}

message LogEntry {
  uint64 term = 1;
  uint64 index = 2;
  bytes command = 3;
}

message AppendEntriesRequest {
  // See RequestVoteRequest.group.
  uint32 group = 8;
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 prev_log_index = 3;
  uint64 prev_log_term = 4;
  repeated LogEntry entries = 5;
  uint64 leader_commit = 6;
  // ReadIndex round (M7). A leader confirming that it still leads must count
  // only acks to heartbeats it sent *after* the read was recorded; an ack
  // already in flight proves leadership at some earlier instant, and the
  // leader could have been deposed in between. The follower echoes this back
  // untouched so the leader can tell the two apart.
  //
  // `optional` for the same reason the conflict hints are: absence is
  // meaningful, and a sentinel 0 would make round 0 and "no round" the same
  // value.
  optional uint64 read_round = 7;
}

message AppendEntriesResponse {
  uint64 term = 1;
  bool success = 2;
  // Conflict hint fields (§1.5) so the leader can skip a whole term of
  // backtracking in one round trip instead of decrementing next_index by one.
  // `optional` because kv-raft models these as Option<u64> and absence is
  // meaningful: a sentinel 0 would be a lossy encoding, and a lossy conversion
  // here produces bugs that look like Raft bugs.
  optional uint64 conflict_term = 3;
  optional uint64 conflict_index = 4;
  // Highest index the follower confirms matching, so the leader never infers
  // it from its own last send — see Message::AppendEntriesResp in kv-raft.
  uint64 match_index = 5;
  // Echoed from the request, untouched. See AppendEntriesRequest.read_round.
  optional uint64 read_round = 6;
}

message InstallSnapshotChunk {
  // See RequestVoteRequest.group. Repeated on every chunk, like the
  // membership below, so each chunk stays self-describing.
  uint32 group = 10;
  uint64 term = 1;
  uint64 leader_id = 2;
  uint64 last_included_index = 3;
  uint64 last_included_term = 4;
  uint64 offset = 5;
  bytes data = 6;
  bool done = 7;
  // Membership as of the boundary (M9): conf entries at or below it are gone
  // with the prefix. Repeated on every chunk so each chunk is self-describing
  // and the assembly check stays a pure uniformity comparison.
  repeated uint64 voters = 8;
  repeated uint64 learners = 9;
}

message InstallSnapshotResponse {
  uint64 term = 1;
  bool success = 2;
}

// Leadership handoff (M9): a leader that committed its own removal tells the
// most-caught-up voter to campaign at once.
message TimeoutNowRequest {
  // See RequestVoteRequest.group.
  uint32 group = 3;
  uint64 term = 1;
  uint64 leader_id = 2;
}

message TimeoutNowResponse {
  uint64 term = 1;
}
