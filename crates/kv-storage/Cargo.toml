[package]
name = "kv-storage"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
crc32fast.workspace = true
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
bincode.workspace = true
tracing.workspace = true
# Backs the KeyDirIndex trait's left-right impl, added at M11.5 (see plan §1.15).
left-right.workspace = true

[dev-dependencies]
libc.workspace = true
proptest.workspace = true
tempfile.workspace = true
criterion.workspace = true
dashmap.workspace = true
loom.workspace = true

[[bench]]
name = "engine"
harness = false

[[bench]]
name = "read_scaling"
harness = false

[[bench]]
name = "index_scaling"
harness = false

# `loom` is a deliberate, separately-run configuration: `RUSTFLAGS="--cfg loom"
# cargo test -p kv-storage --lib` builds left-right against loom's atomics so
# the model can actually explore its interleavings. Declared so the ordinary
# build does not warn about the cfg it never sets.
[lints.rust.unexpected_cfgs]
level = "warn"
priority = 0
check-cfg = ["cfg(loom)"]
