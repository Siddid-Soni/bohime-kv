# PURE Raft state machine. No tokio, no tonic, no filesystem, no wall-clock
# reads — see plan Part 2. This boundary is what makes deterministic
# simulation (kv-sim, M4) possible; do not add an async/IO dependency here.
[package]
name = "kv-raft"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
thiserror.workspace = true
serde = { workspace = true, features = ["derive"] }
bincode.workspace = true
tracing.workspace = true
rand.workspace = true

[dev-dependencies]
proptest.workspace = true

